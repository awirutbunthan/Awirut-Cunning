[project]
name = "ledger-beacon-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0", "uvicorn==0.30.6", "python-multipart==0.0.12",
  "sqlalchemy==2.0.36", "alembic==1.13.3", "pydantic==2.9.2", "pdfplumber==0.11.4", "openpyxl==3.1.5"
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "httpx==0.27.2", "ruff==0.6.9"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"] # Formatter owns line wrapping; some typed API payloads are clearer on one line.
